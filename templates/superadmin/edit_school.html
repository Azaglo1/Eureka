{% extends "superadmin/base.html" %}
{% block title %}Edit School - Super Admin{% endblock %}
{% block page_title %}Edit School{% endblock %}
{% block content %}
<div class="portal-section">
    <div class="section-header">
        <a href="{{ url_for('superadmin_view_school', school_id=school.id) }}" class="btn btn-outline-secondary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
            Back to School Details
        </a>
    </div>
    
    <form method="post" class="form-container">
        <div class="form-group">
            <label for="name">School Name *</label>
            <input type="text" id="name" name="name" required value="{{ school.name }}">
        </div>
        
        <div class="form-group">
            <label for="school_code">School Code *</label>
            <input type="text" id="school_code" name="school_code" required value="{{ school.school_code }}">
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3">{{ school.description or '' }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="school_email">School Email</label>
            <input type="email" id="school_email" name="school_email" value="{{ school.school_email or '' }}" placeholder="info@school.edu.gh">
        </div>
        
        <div class="form-group">
            <label for="school_phone">School Phone</label>
            <input type="text" id="school_phone" name="school_phone" value="{{ school.school_phone or '' }}" placeholder="+233...">
        </div>
        
        <div class="form-group">
            <label for="school_address">School Address</label>
            <input type="text" id="school_address" name="school_address" value="{{ school.school_address or '' }}" placeholder="Enter school address">
        </div>
        
        <div class="form-group">
            <label for="school_website">School Website</label>
            <input type="text" id="school_website" name="school_website" value="{{ school.school_website or '' }}" placeholder="www.school.edu.gh">
        </div>
        
        <div class="form-section-title">Email Configuration</div>
        
        <div class="form-group">
            <label for="smtp_server">SMTP Server</label>
            <input type="text" id="smtp_server" name="smtp_server" value="{{ school.smtp_server or '' }}" placeholder="smtp.gmail.com">
        </div>
        
        <div class="form-group">
            <label for="smtp_port">SMTP Port</label>
            <input type="number" id="smtp_port" name="smtp_port" value="{{ school.smtp_port or '' }}" placeholder="587">
        </div>
        
        <div class="form-group">
            <label for="smtp_email">SMTP Email</label>
            <input type="email" id="smtp_email" name="smtp_email" value="{{ school.smtp_email or '' }}" placeholder="notifications@school.edu.gh">
        </div>
        
        <div class="form-group">
            <label for="smtp_password">SMTP Password</label>
            <input type="password" id="smtp_password" name="smtp_password" value="{{ school.smtp_password or '' }}" placeholder="Enter SMTP password">
        </div>
        
        <div class="form-group">
            <label for="sender_name">Sender Name</label>
            <input type="text" id="sender_name" name="sender_name" value="{{ school.sender_name or '' }}" placeholder="School Administration">
        </div>
        
        <div class="form-section-title">SMS Configuration (Twilio)</div>
        
        <div class="form-group">
            <label for="twilio_account_sid">Twilio Account SID</label>
            <input type="text" id="twilio_account_sid" name="twilio_account_sid" value="{{ school.twilio_account_sid or '' }}" placeholder="AC...">
        </div>
        
        <div class="form-group">
            <label for="twilio_auth_token">Twilio Auth Token</label>
            <input type="password" id="twilio_auth_token" name="twilio_auth_token" value="{{ school.twilio_auth_token or '' }}" placeholder="Enter auth token">
        </div>
        
        <div class="form-group">
            <label for="twilio_from_number">Twilio Phone Number</label>
            <input type="text" id="twilio_from_number" name="twilio_from_number" value="{{ school.twilio_from_number or '' }}" placeholder="+1...">
        </div>
        
        <div class="form-group">
            <label for="twilio_messaging_service_sid">Twilio Messaging Service SID</label>
            <input type="text" id="twilio_messaging_service_sid" name="twilio_messaging_service_sid" value="{{ school.twilio_messaging_service_sid or '' }}" placeholder="MG...">
        </div>
        
        <div class="form-section-title">WhatsApp Configuration</div>
        
        <div class="form-group">
            <label for="whatsapp_access_token">WhatsApp Access Token</label>
            <input type="password" id="whatsapp_access_token" name="whatsapp_access_token" value="{{ school.whatsapp_access_token or '' }}" placeholder="Enter access token">
        </div>
        
        <div class="form-group">
            <label for="whatsapp_phone_number_id">WhatsApp Phone Number ID</label>
            <input type="text" id="whatsapp_phone_number_id" name="whatsapp_phone_number_id" value="{{ school.whatsapp_phone_number_id or '' }}" placeholder="Phone Number ID">
        </div>
        
        <div class="form-actions">
            <a href="{{ url_for('superadmin_view_school', school_id=school.id) }}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>
</div>
{% endblock %}
